<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{base}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Contact Messages</title>
</head>

<body>
  <div layout:fragment="content">
    <main class="container my-5 pt-5 pb-5">
      <h1 class="text-center mb-5">Contact Form Submissions</h1>

      <div class="card shadow p-4">
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Contact Number</th>
                <th scope="col">Message</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="message : ${messages}">
                <th scope="row" th:text="${message.id}">1</th>
                <td th:text="${message.name}">John Doe</td>
                <td th:text="${message.email}">john.doe@example.com</td>
                <td th:text="${message.contactNumber}">9876543210</td>
                <td th:text="${message.message}">This is a test message.</td>
              </tr>
              <tr th:if="${#lists.isEmpty(messages)}">
                <td colspan="5" class="text-center">No messages found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
