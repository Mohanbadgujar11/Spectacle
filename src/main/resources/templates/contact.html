<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{base}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Spectacle</title>

</head>

<body>
  <div layout:fragment="content">


    <main class="container my-5 pt-5 pb-5">
      <h1 class="text-center mb-5">Get in Touch</h1>

      <div class="row justify-content-center">
        <!-- Contact Form -->
        <div class="col-md-6">
          <div class="card shadow p-4">
            <h3 class="mb-3">Send a Message</h3>
            <form th:action="@{/contact}" method="post">
              
              <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required />
              </div>
              <div class="mb-3">
                <label for="contact" class="form-label">Contact Number</label>
                <input type="tel" class="form-control" id="contact-number" name="contact-number" placeholder="98765 43219" pattern="[0-9]{10}"
                  maxlength="10" required />
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="How can we help you?"
                  required></textarea>
              </div>
              <button id="submit" type="submit" class="btn btn-primary w-100"
                style="background-color: #f39c9c; border: none ">

                Send Message
              </button>
            </form>
          </div>
        </div>

        <!-- Developer Info -->
        <div class="col-md-4 offset-md-1 mt-4 mt-md-0">
          <h3>Contact us</h3>
          <p class="text-muted">
            We'd love to hear from you! Whether you have questions, feedback, or
            just want to say hello, feel free to reach out.
          </p>
          <ul class="list-unstyled">
            <li class="mb-3">
              <strong>Email:</strong> <br />
              support@spectacle.in
            </li>
            <li class="mb-3">
              <strong>Location:</strong> <br />
              Mumbai, India
            </li>
          </ul>
        </div>
      </div>
    </main>

    <div id="successModal" class="success-modal" style="display:none;">
      <div class="success-modal-content">
        <h4>Thanks! Your message has been sent!</h4>
        <button id="successModalOk" type="button" class="btn btn-primary mt-3">OK</button>
      </div>
    </div>

    <style>
      .success-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
      }

      .success-modal-content {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        padding: 28px 24px;
        text-align: center;
        max-width: 420px;
        width: 100%;
      }

      .success-modal-content h4 {
        margin: 0;
        color: #333;
      }
    </style>

  </div>
</body>

</html>
