<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head>
    <title>Order Confirmed - Spectacle</title>
    <th:block layout:fragment="styles">
        <style>
            .confirmation-card {
                background: #fff;
                border-radius: 15px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
                padding: 40px;
                margin-top: 30px;
                text-align: center;
            }
            .confirmation-icon {
                font-size: 5rem;
                color: #28a745;
            }
            .order-details {
                text-align: left;
                margin-top: 30px;
                background-color: #f8f9fa;
                padding: 20px;
                border-radius: 8px;
            }
            .btn-primary {
                background-color: #f39c9c;
                border-color: #f39c9c;
            }
            .btn-primary:hover {
                background-color: #e88383;
                border-color: #e88383;
            }
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="confirmation-card">
                    <div class="confirmation-icon">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h1 class="mt-3">Thank You For Your Order!</h1>
                    <p class="lead text-muted">Your order has been placed successfully.</p>
                    <p>Your Order ID is: <strong th:text="${order.id}">#12345</strong>. You will receive an email confirmation shortly.</p>

                    <div class="order-details">
                        <h5>Order Summary</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between" style="background: transparent;">
                                <span>Order Date:</span>
                                <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between" style="background: transparent;">
                                <span>Delivery Address:</span>
                                <span th:text="${order.address.fullAddress}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between" style="background: transparent;">
                                <span>Total Amount:</span>
                                <strong>₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></strong>
                            </li>
                        </ul>
                    </div>

                    <div class="mt-4">
                        <a th:href="@{/}" class="btn btn-primary btn-lg">Continue Shopping</a>
                        <a th:href="@{/orders}" class="btn btn-outline-secondary btn-lg ms-2">View My Orders</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
