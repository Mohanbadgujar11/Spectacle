<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-1">Contact Form Submissions</h2>
        <p class="text-muted mb-0">All messages submitted through the contact form are listed here.</p>
      </div>
      <a th:href="@{/admin}" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <div th:if="${#lists.isEmpty(messages)}" class="alert alert-info">No contact messages have been submitted yet.</div>

    <div th:unless="${#lists.isEmpty(messages)}" class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Contact</th>
            <th>Message</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="message : ${messages}">
            <td th:text="${message.id}"></td>
            <td th:text="${message.name}"></td>
            <td th:text="${message.email}"></td>
            <td th:text="${message.contactNumber}"></td>
            <td th:text="${message.message}"></td>
            <td>
              <form th:action="@{/admin/messages/delete/{id}(id=${message.id})}" method="post" onsubmit="return confirm('Delete this message?');">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
