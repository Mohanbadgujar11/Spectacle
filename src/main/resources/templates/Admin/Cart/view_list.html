<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart Items Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid mt-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Cart Items Management</h1>
            <div>
                <a th:href="@{/admin/cart/add}" class="btn btn-primary">Add New Cart Item</a>
                <a th:href="@{/admin}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cartItem : ${cartItems}">
                            <td th:text="${cartItem.id}"></td>
                            <td th:text="${cartItem.user?.username ?: 'N/A'}"></td>
                            <td th:text="${cartItem.product?.name ?: 'N/A'}"></td>
                            <td th:text="${cartItem.quantity}"></td>
                            <td>
                                <!-- Update button (assuming you have an update form) -->
                                <!-- <a th:href="@{/admin/cart/update/{id}(id=${cartItem.id})}" class="btn btn-warning btn-sm">Edit</a> -->
                                <!-- Delete Button (using a form for POST request) -->
                                <form th:action="@{/admin/cart/delete/{id}(id=${cartItem.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this cart item?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-danger btn-sm ms-1">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
