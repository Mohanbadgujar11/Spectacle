<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Address Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid mt-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Address Management</h1>
            <div>
                <a th:href="@{/admin/addresses/add}" class="btn btn-primary">Add New Address</a>
                <a th:href="@{/admin}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Full Address</th>
                            <th>City</th>
                            <th>Pincode</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="address : ${addresses}">
                            <td th:text="${address.id}"></td>
                            <td th:text="${address.user?.username ?: 'N/A'}"></td>
                            <td th:text="${address.name}"></td>
                            <td th:text="${address.city}"></td>
                            <td th:text="${address.pincode}"></td>
                            <td>
                                <a th:href="@{/admin/addresses/update/{id}(id=${address.id})}" class="btn btn-warning btn-sm">Edit</a>
                                <form th:action="@{/admin/addresses/delete/{id}(id=${address.id})}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this address?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-danger btn-sm ms-1">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
